    <title>시장 분석 · Bitcoin Cycle Atlas</title>
  <script id="atlas-theme-preference">
    // Restore only presentation preference before any blocking stylesheet paints.
    (() => {
      let theme = 'dark';
      let chartColors = 'korean';
      try {
        const saved = localStorage.getItem('atlas-ui-theme');
        if (saved === 'light' || saved === 'dark') theme = saved;
        const savedChartColors = localStorage.getItem('atlas-chart-colors');
        if (savedChartColors === 'korean' || savedChartColors === 'international') chartColors = savedChartColors;
      } catch { /* Local fonts and the default theme work without storage. */ }
      document.documentElement.dataset.theme = theme;
      document.documentElement.style.colorScheme = theme;
      document.documentElement.dataset.chartColors = chartColors;
    })();
  </script>
  <style>html,body{overflow-x:clip}:root{--initial-surface:#0f0f0f;--initial-ink:#dbdbdb;--initial-placeholder:#303030}html,body,#root{margin:0;height:100%;background:var(--bg,var(--initial-surface));color:var(--text,var(--initial-ink))}#root>.atlas-skeleton{height:100%;box-sizing:border-box;padding:0}.atlas-loading-label{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%)}#root>.atlas-skeleton .atlas-skeleton-shape,#root>.atlas-skeleton .atlas-skeleton-paint,#root>.atlas-skeleton .atlas-skeleton-chart{height:100%;min-height:0}#root>.atlas-skeleton .atlas-skeleton-shape{display:flex;flex-direction:column}#root>.atlas-skeleton .atlas-skeleton-chart{flex:1;display:grid;grid-template-columns:minmax(0,1fr) 66px;grid-template-rows:minmax(0,1fr) 28px}#root>.atlas-skeleton .atlas-skeleton-plot{grid-column:1;grid-row:1;min-height:0;background:var(--surface-raised,var(--initial-placeholder));opacity:.32}#root>.atlas-skeleton .atlas-skeleton-y-axis{grid-column:2;grid-row:1;display:flex;flex-direction:column;justify-content:space-between;padding:12px 8px}#root>.atlas-skeleton .atlas-skeleton-x-axis{grid-column:1;grid-row:2;display:flex;align-items:center;justify-content:space-between;padding:0 12px}#root>.atlas-skeleton [skullet-bar]{display:block;background:var(--surface-raised,var(--initial-placeholder));border-radius:3px}</style>
