name: Hallmark design audit

on:
  pull_request:
    paths:
      - 'dist/**'
      - 'tools/hallmark/**'
      - 'scripts/verify-hallmark-design.mjs'
      - '.github/workflows/hallmark-design.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hallmark-design-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Check out immutable design baseline
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: 0c1ed40e1b9b6c76f5621d087737dc57f174b51e
          path: build/hallmark-baseline
      - name: Install isolated pinned browser tooling
        timeout-minutes: 2
        env:
          npm_config_fetch_retries: '1'
          npm_config_fetch_timeout: '45000'
        run: |
          set -euo pipefail
          hallmark_node_dir="$RUNNER_TEMP/hallmark-node"
          npm install --prefix "$hallmark_node_dir" --no-save --no-package-lock --ignore-scripts --no-audit --no-fund puppeteer-core@25.16.0
          hallmark_chrome_path="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium)"
          test -n "$hallmark_chrome_path"
          echo "HALLMARK_PUPPETEER=$hallmark_node_dir" >> "$GITHUB_ENV"
          echo "CHROME_PATH=$hallmark_chrome_path" >> "$GITHUB_ENV"
          "$hallmark_chrome_path" --version
      - name: Install the source-pinned Korean font
        timeout-minutes: 3
        run: |
          set -euo pipefail
          hallmark_font_dir="$HOME/.local/share/fonts/atlas-ci"
          hallmark_font_temp="$RUNNER_TEMP/hallmark-noto-cjk"
          mkdir -p "$hallmark_font_dir" "$hallmark_font_temp"
          curl --fail --location --silent --show-error --proto '=https' --connect-timeout 10 --max-time 60 --output "$hallmark_font_temp/NotoSansCJKkr-Regular.otf" 'https://raw.githubusercontent.com/notofonts/noto-cjk/f8d157532fbfaeda587e826d4cd5b21a49186f7c/Sans/OTF/Korean/NotoSansCJKkr-Regular.otf'
          hallmark_font_blob="$(git hash-object --no-filters "$hallmark_font_temp/NotoSansCJKkr-Regular.otf")"
          test "$hallmark_font_blob" = 'dc4a7c65e6f450bf17c10a2405250b620eb78703'
          curl --fail --location --silent --show-error --proto '=https' --connect-timeout 10 --max-time 60 --output "$hallmark_font_temp/OFL.txt" 'https://raw.githubusercontent.com/notofonts/noto-cjk/f8d157532fbfaeda587e826d4cd5b21a49186f7c/Sans/LICENSE'
          hallmark_font_license_blob="$(git hash-object --no-filters "$hallmark_font_temp/OFL.txt")"
          test "$hallmark_font_license_blob" = 'd952d62c065f3f35fb83a173496e90b21525aef3'
          install -m 0644 "$hallmark_font_temp/NotoSansCJKkr-Regular.otf" "$hallmark_font_dir/NotoSansCJKkr-Regular.otf"
          install -m 0644 "$hallmark_font_temp/OFL.txt" "$hallmark_font_dir/OFL.txt"
          timeout 30s fc-cache -f "$hallmark_font_dir"
          fc-scan --format '%{family}\n' "$hallmark_font_dir/NotoSansCJKkr-Regular.otf"
          fc-list ':lang=ko' file | grep -F -- "$hallmark_font_dir/NotoSansCJKkr-Regular.otf"
          echo "HALLMARK_FONT_FILE=$hallmark_font_dir/NotoSansCJKkr-Regular.otf" >> "$GITHUB_ENV"
          echo "HALLMARK_FONT_RECEIPT commit=f8d157532fbfaeda587e826d4cd5b21a49186f7c font_blob=$hallmark_font_blob license_blob=$hallmark_font_license_blob"
      - name: Audit all static files and eight rendered routes before and after
        run: |
          node --check scripts/verify-hallmark-design.mjs
          node scripts/verify-hallmark-design.mjs --baseline build/hallmark-baseline --out build/hallmark
      - name: Preserve findings, source receipts and before/after screenshots
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: hallmark-design-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            build/hallmark/receipt.json
            build/hallmark/reports
            build/hallmark/work/.hallmark
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
