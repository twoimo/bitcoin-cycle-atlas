name: Date50 full native browser regression
on:
  push:
    branches: [stage/replay-date-50-v1.29.10]
    paths: [.github/workflows/verify-date50-native.yml]
permissions:
  contents: read
jobs:
  native:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 709da73c042625c8c4a84373818e0bf52703b940
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Install source-pinned Korean font
        run: |
          mkdir -p "$HOME/.local/share/fonts/atlas-ci"
          curl --fail --location --silent --show-error --connect-timeout 10 --max-time 60 -o /tmp/date50-font.otf https://raw.githubusercontent.com/notofonts/noto-cjk/f8d157532fbfaeda587e826d4cd5b21a49186f7c/Sans/OTF/Korean/NotoSansCJKkr-Regular.otf
          test "$(git hash-object /tmp/date50-font.otf)" = dc4a7c65e6f450bf17c10a2405250b620eb78703
          cp /tmp/date50-font.otf "$HOME/.local/share/fonts/atlas-ci/"
          timeout 30s fc-cache -f "$HOME/.local/share/fonts/atlas-ci"
      - name: Exercise the full existing native browser suite
        env:
          ETH_BROWSER_IMAGE_LOG_MODE: failures-only
        run: node scripts/verify-eth-candidate-browser.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: date50-full-native
          path: build/eth-browser
          retention-days: 14
