name: ETH candidate evidence

on:
  pull_request:
    paths:
      - 'dist/**'
      - 'tests/ethereum-*.test.mjs'
      - 'tests/asset-forecast*.test.mjs'
      - 'tests/asset-outcome*.test.mjs'
      - 'tests/helpers/asset-outcome*.mjs'
      - 'tests/eth-review-packet.test.mjs'
      - 'tests/journal-entry-ownership.test.mjs'
      - 'tests/equity-chart-rendering.test.mjs'
      - 'tests/eth-chart-rendering.test.mjs'
      - 'tests/treasury-model.test.mjs'
      - 'tests/helpers/eth-*.mjs'
      - 'scripts/evaluate-ethereum-models.mjs'
      - 'scripts/evaluate-ethereum-adaptive-research.mjs'
      - 'scripts/verify-eth-candidate-browser.mjs'
      - 'scripts/capture-ethereum-economic-data.mjs'
      - 'scripts/issue-asset-forecasts.mjs'
      - 'scripts/evaluate-asset-forecasts.mjs'
      - 'research-data/asset-outcome-ledger/**'
      - 'research-data/eth-economic-captures/**'
      - 'scripts/build-eth-review*.mjs'
      - 'research-data/eth-review-scope.json'
      - '.github/workflows/eth-model-evaluation.yml'

permissions:
  contents: read

concurrency:
  group: eth-candidate-evidence-${{ github.ref }}
  cancel-in-progress: true

jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Test candidate equations, missing inputs, clocks and future-information boundaries
        run: node --test tests/ethereum-adaptive-model.test.mjs tests/ethereum-adoption-scenarios.test.mjs tests/ethereum-cycle-models.test.mjs tests/ethereum-economic-model.test.mjs tests/ethereum-economic-ablation.test.mjs tests/ethereum-model-comparison.test.mjs tests/ethereum-forecast-boundary.test.mjs tests/equity-chart-rendering.test.mjs tests/eth-chart-rendering.test.mjs tests/ethereum-forecast.test.mjs tests/ethereum-economic-data.test.mjs tests/ethereum-economic-collector.test.mjs tests/asset-forecast-records.test.mjs tests/asset-forecast-collector.test.mjs tests/asset-outcome-records.test.mjs tests/asset-outcome-collector.test.mjs tests/ethereum-historical-gas-source.test.mjs tests/asset-forecast-journal.test.mjs tests/journal-entry-ownership.test.mjs tests/eth-review-packet.test.mjs tests/treasury-model.test.mjs
      - name: Evaluate preserved asset forecasts without requiring a new forecast issue
        run: |
          node scripts/evaluate-asset-forecasts.mjs
          node scripts/evaluate-asset-forecasts.mjs --emit-files
      - name: Collect pinned public economic source with actual acquisition receipts
        run: node scripts/capture-ethereum-economic-data.mjs
      - name: Evaluate the exact committed candidates and current stored prices
        run: node scripts/evaluate-ethereum-models.mjs
      - name: Audit ETH periods, volatility, simulation and institutional arithmetic
        run: node scripts/evaluate-ethereum-adaptive-research.mjs
      - name: Verify preserved ETH BMNR and MSTR records and issue only with current inputs
        run: |
          node scripts/issue-asset-forecasts.mjs --replay-preserved-if-stale
          # Replay a second time and print compact receipts. Stale prices permit
          # preservation/replay only: no new record or false issue timestamp.
          # The complete immutable
          # ledger remains in the artifact below; do not duplicate it in the job log.
          node scripts/issue-asset-forecasts.mjs --replay-preserved-if-stale
      - name: Install a pinned Korean font with bounded network and cache time
        timeout-minutes: 3
        run: |
          set -euo pipefail
          atlas_font_dir="$HOME/.local/share/fonts/atlas-ci"
          atlas_font_temp="$RUNNER_TEMP/atlas-noto-cjk"
          mkdir -p "$atlas_font_dir" "$atlas_font_temp"
          curl --fail --location --silent --show-error --proto '=https' --connect-timeout 10 --max-time 60 --output "$atlas_font_temp/NotoSansCJKkr-Regular.otf" 'https://raw.githubusercontent.com/notofonts/noto-cjk/f8d157532fbfaeda587e826d4cd5b21a49186f7c/Sans/OTF/Korean/NotoSansCJKkr-Regular.otf'
          atlas_font_blob="$(git hash-object --no-filters "$atlas_font_temp/NotoSansCJKkr-Regular.otf")"
          test "$atlas_font_blob" = 'dc4a7c65e6f450bf17c10a2405250b620eb78703'
          curl --fail --location --silent --show-error --proto '=https' --connect-timeout 10 --max-time 60 --output "$atlas_font_temp/OFL.txt" 'https://raw.githubusercontent.com/notofonts/noto-cjk/f8d157532fbfaeda587e826d4cd5b21a49186f7c/Sans/LICENSE'
          atlas_font_license_blob="$(git hash-object --no-filters "$atlas_font_temp/OFL.txt")"
          test "$atlas_font_license_blob" = 'd952d62c065f3f35fb83a173496e90b21525aef3'
          install -m 0644 "$atlas_font_temp/NotoSansCJKkr-Regular.otf" "$atlas_font_dir/NotoSansCJKkr-Regular.otf"
          install -m 0644 "$atlas_font_temp/OFL.txt" "$atlas_font_dir/OFL.txt"
          timeout 30s fc-cache -f "$atlas_font_dir"
          fc-scan --format '%{family}\n' "$atlas_font_dir/NotoSansCJKkr-Regular.otf"
          fc-list ':lang=ko' file | grep -F -- "$atlas_font_dir/NotoSansCJKkr-Regular.otf"
          echo "ATLAS_FONT_RECEIPT commit=f8d157532fbfaeda587e826d4cd5b21a49186f7c font_blob=$atlas_font_blob license_blob=$atlas_font_license_blob"
      - name: Render comparison ETH BMNR MSTR and saved-record screens across mobile, tablet and desktop
        run: |
          node --check scripts/verify-eth-candidate-browser.mjs
          node scripts/verify-eth-candidate-browser.mjs . build/eth-browser
      - name: Bind exact committed sources inputs and execution evidence for external review
        run: node scripts/build-eth-review-evidence.mjs
      - name: Preserve complete source-identified candidate evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4, ref verified through GitHub
        with:
          name: eth-candidate-evidence-${{ github.event.pull_request.head.sha }}
          path: |
            build/ethereum-adaptive-research.json
            build/ethereum-model-comparison.json
            build/ethereum-economic-ablation.json
            build/ethereum-economic-data
            build/asset-forecast-ledger
            build/asset-outcome-ledger
            build/eth-review-packet
            build/eth-browser
          if-no-files-found: error
          retention-days: 30
