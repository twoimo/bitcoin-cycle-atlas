name: ETH candidate evidence

on:
  pull_request:
    paths:
      - 'dist/ethereum-*model*.js'
      - 'dist/ethereum-forecast.js'
      - 'dist/eth-view.js'
      - 'dist/eth-view.css'
      - 'dist/intraday-chart.js'
      - 'dist/equity-forecast-chart.js'
      - 'tests/equity-chart-rendering.test.mjs'
      - 'tests/ethereum-forecast.test.mjs'
      - 'tests/ethereum-*model*.test.mjs'
      - 'tests/ethereum-forecast-boundary.test.mjs'
      - 'scripts/evaluate-ethereum-models.mjs'
      - 'scripts/verify-eth-candidate-browser.mjs'
      - '.github/workflows/eth-model-evaluation.yml'

permissions:
  contents: read

concurrency:
  group: eth-candidate-evidence-${{ github.ref }}
  cancel-in-progress: true

jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Test candidate equations, missing inputs, clocks and future-information boundaries
        run: node --test tests/ethereum-cycle-models.test.mjs tests/ethereum-economic-model.test.mjs tests/ethereum-economic-ablation.test.mjs tests/ethereum-model-comparison.test.mjs tests/ethereum-forecast-boundary.test.mjs tests/equity-chart-rendering.test.mjs tests/ethereum-forecast.test.mjs
      - name: Evaluate the exact committed candidates and current stored prices
        run: node scripts/evaluate-ethereum-models.mjs
      - name: Install a pinned Korean font with bounded network and cache time
        timeout-minutes: 3
        run: |
          set -euo pipefail
          atlas_font_dir="$HOME/.local/share/fonts/atlas-ci"
          atlas_font_temp="$RUNNER_TEMP/atlas-noto-cjk"
          mkdir -p "$atlas_font_dir" "$atlas_font_temp"
          curl --fail --location --silent --show-error --proto '=https' --connect-timeout 10 --max-time 60 --output "$atlas_font_temp/NotoSansCJKkr-Regular.otf" 'https://raw.githubusercontent.com/notofonts/noto-cjk/f8d157532fbfaeda587e826d4cd5b21a49186f7c/Sans/OTF/Korean/NotoSansCJKkr-Regular.otf'
          atlas_font_blob="$(git hash-object --no-filters "$atlas_font_temp/NotoSansCJKkr-Regular.otf")"
          test "$atlas_font_blob" = 'dc4a7c65e6f450bf17c10a2405250b620eb78703'
          curl --fail --location --silent --show-error --proto '=https' --connect-timeout 10 --max-time 60 --output "$atlas_font_temp/OFL.txt" 'https://raw.githubusercontent.com/notofonts/noto-cjk/f8d157532fbfaeda587e826d4cd5b21a49186f7c/Sans/LICENSE'
          atlas_font_license_blob="$(git hash-object --no-filters "$atlas_font_temp/OFL.txt")"
          test "$atlas_font_license_blob" = 'd952d62c065f3f35fb83a173496e90b21525aef3'
          install -m 0644 "$atlas_font_temp/NotoSansCJKkr-Regular.otf" "$atlas_font_dir/NotoSansCJKkr-Regular.otf"
          install -m 0644 "$atlas_font_temp/OFL.txt" "$atlas_font_dir/OFL.txt"
          timeout 30s fc-cache -f "$atlas_font_dir"
          fc-scan --format '%{family}\n' "$atlas_font_dir/NotoSansCJKkr-Regular.otf"
          fc-list ':lang=ko' file | grep -F -- "$atlas_font_dir/NotoSansCJKkr-Regular.otf"
          echo "ATLAS_FONT_RECEIPT commit=f8d157532fbfaeda587e826d4cd5b21a49186f7c font_blob=$atlas_font_blob license_blob=$atlas_font_license_blob"
      - name: Render comparison and ETH screens across mobile, tablet and desktop
        run: |
          node --check scripts/verify-eth-candidate-browser.mjs
          node scripts/verify-eth-candidate-browser.mjs . build/eth-browser
      - name: Preserve complete source-identified candidate evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4, ref verified through GitHub
        with:
          name: eth-candidate-evidence-${{ github.event.pull_request.head.sha }}
          path: |
            build/ethereum-model-comparison.json
            build/ethereum-economic-ablation.json
            build/eth-review-source-bundle.txt
            build/eth-review-source-manifest.json
            build/eth-browser
          if-no-files-found: error
          retention-days: 30
