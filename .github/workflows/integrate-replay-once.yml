name: Integrate reviewed replay persistence once
on:
  push:
    branches: [prepare/replay-persistence-v1.29.8]
permissions:
  contents: write
concurrency:
  group: prepare-replay-persistence-v1.29.8
  cancel-in-progress: false
jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Validate exact base, patch and final source tree
        shell: bash
        run: |
          set -euo pipefail
          git diff --quiet 2e8d6a7155f6ac6dbcbb40d74ed99c0b4c1ed92c -- . ':!tools/.replay-delivery' ':!.github/workflows/integrate-replay-once.yml'
          test "$(git show 2e8d6a7155f6ac6dbcbb40d74ed99c0b4c1ed92c:package.json | node -pe 'JSON.parse(require("fs").readFileSync(0,"utf8")).version')" = '1.29.7'
          cat tools/.replay-delivery/part-* | gzip -dc > "$RUNNER_TEMP/integration.patch"
          echo '129f9d54fa3ef4783b395fc4793008f9590c603bdcc76a550e9dfb129e88d168  '"$RUNNER_TEMP/integration.patch" | sha256sum -c -
          git apply --check --unidiff-zero "$RUNNER_TEMP/integration.patch"
          git apply --unidiff-zero "$RUNNER_TEMP/integration.patch"
          git rm -r tools/.replay-delivery .github/workflows/integrate-replay-once.yml
          git add dist docs package.json scripts tests
          test "$(git write-tree)" = '8976bc99e80525f4f3d4926bba728b038e646f09'
      - name: Run unchanged focused assertions on Node 24
        shell: bash
        run: |
          set -euo pipefail
          node --test tests/chart-replay-snapshot.test.mjs tests/chart-replay-ui.test.mjs tests/replay-fixed-forecast-ui.test.mjs tests/replay-fixed-forecast.test.mjs | tee "$RUNNER_TEMP/replay-persistence-focused.tap"
      - name: Commit only verified product files to this preparation branch
        shell: bash
        run: |
          set -euo pipefail
          test "$(git write-tree)" = '8976bc99e80525f4f3d4926bba728b038e646f09'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix: persist full replay forecasts and paint real candles above them (v1.29.8)'
          git push origin HEAD:prepare/replay-persistence-v1.29.8
          git rev-parse HEAD HEAD^{tree} > "$RUNNER_TEMP/replay-persistence-source.txt"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: replay-persistence-application-${{ github.sha }}
          path: |
            ${{ runner.temp }}/replay-persistence-focused.tap
            ${{ runner.temp }}/replay-persistence-source.txt
            ${{ runner.temp }}/integration.patch
          retention-days: 14
