name: Apply reviewed fixed overlay once

on:
  push:
    branches: ['fix/replay-fixed-overlay-v1.29.7']
    paths: ['.github/workflows/apply-fixed-overlay-once.yml']

permissions:
  contents: read

concurrency:
  group: apply-reviewed-fixed-overlay
  cancel-in-progress: false

jobs:
  apply:
    if: github.repository == 'twoimo/bitcoin-cycle-atlas' && github.ref == 'refs/heads/fix/replay-fixed-overlay-v1.29.7'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 2
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Verify exact patch and remove temporary application helper
        run: python .github/atlas-overlay-apply/apply.py
      - name: Run the reviewed patch regressions on Node 24
        shell: bash
        run: |
          set -euo pipefail
          node --test --test-concurrency=2 tests/replay-fixed-forecast.test.mjs tests/replay-fixed-forecast-ui.test.mjs tests/chart-replay-ui.test.mjs 2>&1 | tee "$RUNNER_TEMP/overlay-apply-evidence/focused.tap"
      - name: Commit only the verified tree to the dedicated branch
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_BRANCH: fix/replay-fixed-overlay-v1.29.7
          EXPECTED_TREE: 23d48c9eef363c3e2652cc423e2f68b8483f7c4e
        shell: bash
        run: |
          set -euo pipefail
          test "$(git write-tree)" = "$EXPECTED_TREE"
          test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/$TARGET_BRANCH" --jq '.object.sha')" = "$GITHUB_SHA"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix: keep fixed forecast visible above replay candles (v1.29.7)'
          test "$(git rev-parse 'HEAD^{tree}')" = "$EXPECTED_TREE"
          test -z "$(git status --porcelain)"
          git -c credential.helper= -c 'credential.helper=!gh auth git-credential' push origin "HEAD:refs/heads/$TARGET_BRANCH"
          git rev-parse HEAD > "$RUNNER_TEMP/overlay-apply-evidence/candidate-commit.txt"
      - name: Preserve application and test receipts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: fixed-overlay-application-${{ github.sha }}
          path: ${{ runner.temp }}/overlay-apply-evidence/
          retention-days: 14
          if-no-files-found: error
