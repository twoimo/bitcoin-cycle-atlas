name: Deploy Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      source_commit: ${{ steps.publication.outputs.source_commit }}
      manifest_sha256: ${{ steps.publication.outputs.manifest_sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Test before deployment
        run: npm test
      - name: Verify preserved forecast identities and replay
        run: npm run verify:forecast
      - name: Verify treasury sources and persistent research summaries
        run: npm run verify:research
      - name: Verify reviewed Ethereum history matches the published catalog
        run: npm run verify:eth-events
      - name: Independently reconcile daily treasury paths
        run: npm run verify:treasury-paths
      - name: Independently check numerical identities and causal boundaries
        run: npm run verify:numerics
      - name: Verify bounded request ownership and negative controls
        run: npm run verify:formal
      - name: Verify the published calibration and chart performance gate
        run: |
          npm run verify:cycle
          npm run verify:performance
      - name: Verify static paths
        run: node scripts/verify-static.mjs
      - name: Prepare the committed publication and standalone
        id: publication
        run: |
          npm run build:publication
          npm run verify:publication
          node scripts/build-standalone.mjs build/Bitcoin_Cycles_Comparison.html
          node scripts/verify-static.mjs --standalone build/Bitcoin_Cycles_Comparison.html
          node --input-type=module <<'NODE'
          import {readFile,appendFile} from 'node:fs/promises';
          import {execFileSync} from 'node:child_process';
          const manifest=JSON.parse(await readFile('dist/publication.json','utf8'));
          const head=execFileSync('git',['rev-parse','HEAD'],{encoding:'utf8'}).trim();
          if(manifest.sourceTree?.status!=='clean'||manifest.sourceCommit!==head||!/^[a-f0-9]{64}$/.test(manifest.manifestSha256))throw new Error('Publication must identify this committed source');
          // Only the empty, tracked Pages marker may be included as a hidden file.
          const hidden=manifest.files.filter(file=>file.path.split('/').some(part=>part.startsWith('.')));
          if(hidden.length!==1||hidden[0].path!=='.nojekyll'||hidden[0].bytes!==0||hidden[0].sha256!=='e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855'||(await readFile('dist/.nojekyll')).byteLength!==0)throw new Error('Unexpected hidden file in public artifact');
          await appendFile(process.env.GITHUB_OUTPUT,`source_commit=${head}\nmanifest_sha256=${manifest.manifestSha256}\n`);
          NODE
      - name: Reject a superseded source before upload
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_SOURCE: ${{ steps.publication.outputs.source_commit }}
        run: |
          current_main="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')"
          if [ "$(git rev-parse HEAD)" != "$EXPECTED_SOURCE" ] || [ "$current_main" != "$EXPECTED_SOURCE" ]; then
            echo 'Prepared source is no longer current main. Refusing an outdated publication.' >&2
            exit 1
          fi
      # This is a ready-to-serve static site. Pages must use GitHub Actions as
      # its repository source; configure-pages is not needed to transform it.
      - name: Upload only public site files
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist
          retention-days: 1
          include-hidden-files: true
  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out the exact prepared source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.build.outputs.source_commit }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Reject a superseded source before deployment
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_SOURCE: ${{ needs.build.outputs.source_commit }}
        run: |
          current_main="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')"
          if [ "$(git rev-parse HEAD)" != "$EXPECTED_SOURCE" ] || [ "$current_main" != "$EXPECTED_SOURCE" ]; then
            echo 'Prepared source is no longer current main. Refusing an outdated publication.' >&2
            exit 1
          fi
      - name: Deploy validated artifact
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
      - name: Confirm the served publication identity
        shell: bash
        env:
          PAGES_URL: ${{ steps.deployment.outputs.page_url }}
          EXPECTED_SOURCE: ${{ needs.build.outputs.source_commit }}
          EXPECTED_MANIFEST: ${{ needs.build.outputs.manifest_sha256 }}
        run: |
          for attempt in 1 2 3 4; do
            if node scripts/build-publication.mjs --verify-url "$PAGES_URL" --expected-manifest "$EXPECTED_MANIFEST" --expected-source "$EXPECTED_SOURCE"; then
              exit 0
            fi
            if [ "$attempt" -lt 4 ]; then sleep 10; fi
          done
          echo 'The public site did not serve the exact prepared publication within the retry bound.' >&2
          exit 1
