name: ETH prospective evidence archive

# Definition only while this file remains on a Draft PR branch. GitHub's
# scheduled trigger runs from the default branch; no release is authorized.
on:
  schedule:
    - cron: '17 1 * * *' # 01:17 UTC / 10:17 Asia/Seoul; actual runs can be delayed.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: eth-prospective-archive-writer
  cancel-in-progress: false

jobs:
  preserve:
    if: >-
      github.repository == 'twoimo/bitcoin-cycle-atlas' &&
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch) &&
      (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Validate archive integrity and publication boundaries
        run: |
          node --test tests/ethereum-prospective-archive.test.mjs tests/ethereum-prospective-archive-remote.test.mjs tests/ethereum-prospective-archive-io.test.mjs
      - name: Read the exact archive branch and verify all retained Git objects
        run: node scripts/ethereum-prospective-archive-remote.mjs read
      - name: Restore verified observations and original prospective records
        run: node scripts/manage-ethereum-prospective-archive.mjs restore
      - name: Capture one current ETH tail without backdating missed issuances
        id: acquisition
        continue-on-error: true
        run: node scripts/issue-ethereum-prospective.mjs --include-warm-start
      - name: Reexecute preserved records without changing their issue clocks
        run: node scripts/issue-ethereum-prospective.mjs --verify-preserved-only --include-warm-start
      - name: Validate calibration cases and report remaining input capacity
        run: |
          node scripts/build-ethereum-prospective-calibration-readiness.mjs
          node scripts/analyze-ethereum-prospective-capacity.mjs
      - name: Append new immutable evidence and verify a complete second restore
        run: |
          node scripts/manage-ethereum-prospective-archive.mjs append
          node scripts/manage-ethereum-prospective-archive.mjs verify
      - name: Publish only the validated append to the fixed evidence branch
        env:
          ETH_ARCHIVE_GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/ethereum-prospective-archive-remote.mjs publish
      - name: Preserve receipts and acquisition bytes for failed-run inspection
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: eth-prospective-archive-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            build/ethereum-prospective-archive-remote-receipt.json
            build/ethereum-prospective-archive-restore.json
            build/ethereum-prospective-archive-append.json
            build/ethereum-prospective-archive-verify.json
            build/ethereum-prospective-archive-publication.json
            build/ethereum-prospective-calibration-readiness.json
            build/ethereum-prospective-capacity.json
            build/ethereum-prospective-ledger
          if-no-files-found: warn
          retention-days: 30
      - name: Report a failed acquisition even when its failure evidence was preserved
        if: always() && steps.acquisition.outcome == 'failure'
        run: |
          echo 'The current acquisition failed. Preserved failure evidence is not a successful daily observation.'
          exit 1
